<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ganesh Utsav - Modak Catcher!</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(to bottom, #3a005c, #1a002c);
            color: white;
            font-family: sans-serif;
            overflow: hidden;
            text-align: center;
        }
        #gameCanvas {
            background: radial-gradient(circle, #4a0072 0%, #1f0033 100%);
            display: block;
            margin: 20px auto;
            border: 4px solid #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }
        .stats-board {
            font-size: 24px;
            color: #ffd700;
            margin-top: 15px;
        }
        .instructions {
            font-size: 16px;
            color: #ffb366;
        }
    </style>
</head>
<body>

    <div class="stats-board">Score: <span id="score">0</span> | Lives: <span id="lives">3</span></div>
    <p class="instructions">Catch Modaks! Avoid Rocks. Don't let Modaks fall down!</p>
    
    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreDisplay = document.getElementById("score");
        const livesDisplay = document.getElementById("lives");

        let score = 0;
        let lives = 3;
        let basket = { x: 350, y: 440, width: 100, height: 40, speed: 25 };
        let items = [];
        let gameActive = true;
        let spawnTimeout;

        // Listeners for control
        window.addEventListener("mousemove", (e) => {
            if (!gameActive) return;
            let rect = canvas.getBoundingClientRect();
            basket.x = e.clientX - rect.left - basket.width / 2;
        });

        window.addEventListener("keydown", (e) => {
            if (!gameActive) {
                if (e.key === "r" || e.key === "R") restartGame();
                return;
            }
            if (e.key === "ArrowLeft" && basket.x > 0) basket.x -= basket.speed;
            if (e.key === "ArrowRight" && basket.x < canvas.width - basket.width) basket.x += basket.speed;
        });

        canvas.addEventListener("click", () => {
            if (!gameActive) restartGame();
        });

        function spawnItem() {
            if (!gameActive) return;
            let isModak = Math.random() > 0.3; 
            items.push({
                x: Math.random() * (canvas.width - 30),
                y: 0,
                size: 25,
                speed: Math.random() * 3 + 2,
                type: isModak ? "modak" : "rock"
            });
            spawnTimeout = setTimeout(spawnItem, 1000);
        }

        function endGame() {
            gameActive = false;
            clearTimeout(spawnTimeout);
            
            // Draw a semi-transparent dark overlay
            ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw "Game Over" Text
            ctx.fillStyle = "#ff4d4d";
            ctx.font = "bold 48px sans-serif";
            ctx.fillText("GAME OVER", canvas.width / 2 - 140, canvas.height / 2 - 20);

            // Draw Final Score & Restart instructions
            ctx.fillStyle = "#ffd700";
            ctx.font = "24px sans-serif";
            ctx.fillText("Final Score: " + score, canvas.width / 2 - 70, canvas.height / 2 + 30);
            
            ctx.fillStyle = "#ffffff";
            ctx.fillText("Click the screen or Press 'R' to Play Again", canvas.width / 2 - 200, canvas.height / 2 + 80);
        }

        function restartGame() {
            score = 0;
            lives = 3;
            items = [];
            gameActive = true;
            scoreDisplay.innerText = score;
            livesDisplay.innerText = lives;
            spawnItem();
            update();
        }

        function update() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Basket
            ctx.fillStyle = "#ff9933";
            ctx.fillRect(basket.x, basket.y, basket.width, basket.height);
            ctx.fillStyle = "#ffd700";
            ctx.fillRect(basket.x, basket.y, basket.width, 10); 

            // Update & Draw Items
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += item.speed;

                if (item.type === "modak") {
                    ctx.fillStyle = "#ffcc66"; 
                    ctx.beginPath();
                    ctx.moveTo(item.x, item.y + item.size);
                    ctx.quadraticCurveTo(item.x + item.size/2, item.y - 5, item.x + item.size, item.y + item.size);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    ctx.fillStyle = "#777"; 
                    ctx.beginPath();
                    ctx.arc(item.x + 10, item.y + 10, 12, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Collision with Basket
                if (item.y + item.size >= basket.y && item.x + item.size >= basket.x && item.x <= basket.x + basket.width) {
                    if (item.type === "modak") {
                        score += 10;
                    } else {
                        lives--; // Hit a rock = lose a life
                    }
                    scoreDisplay.innerText = score;
                    livesDisplay.innerText = lives;
                    items.splice(i, 1);
                    
                    if (lives <= 0) {
                        endGame();
                        return;
                    }
                    continue;
                }

                // Item falls past the screen border
                if (item.y > canvas.height) {
                    if (item.type === "modak") {
                        lives--; // Missed a modak = lose a life
                        livesDisplay.innerText = lives;
                    }
                    items.splice(i, 1);

                    if (lives <= 0) {
                        endGame();
                        return;
                    }
                }
            }

            if (gameActive) {
                requestAnimationFrame(update);
            }
        }

        spawnItem();
        update();
    </script>
</body>
</html>
